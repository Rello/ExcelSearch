name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint und Tests
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python installieren
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
          cache: pip

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements-dev.txt

      - name: Code prüfen
        run: ruff check .

      - name: Tests ausführen
        run: python -m pytest

      - name: Headless-Start prüfen
        run: python search_excel.py --smoke-test

      - name: Oberfläche initialisieren
        run: >-
          xvfb-run -a python -c
          "from search_excel import ExcelSearcher;
          app = ExcelSearcher();
          app.update_idletasks();
          app._on_close()"
